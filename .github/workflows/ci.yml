name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - name: Good fixtures lint clean
        run: node dist/cli.js lint fixtures/playwright/good fixtures/cypress/good
      - name: Bad fixtures fail the lint
        run: |
          set +e
          node dist/cli.js lint fixtures/playwright/bad fixtures/cypress/bad > /dev/null
          test $? -eq 1
