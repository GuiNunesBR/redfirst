name: Release

# Publishes to npm when a version tag is pushed, through npm trusted publishing, and the package carries a
# provenance statement that links it to this workflow and commit. npm only accepts a trusted publisher on a
# package that already exists, so the first publish of a new package uses a short-lived NPM_TOKEN secret;
# when the secret is absent, npm authenticates through the trusted publisher.
on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Tag matches the package version
        run: test "${GITHUB_REF_NAME}" = "v$(node -p "require('./package.json').version")"
      - name: Publish unless this version is already on npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          package="$(node -p "require('./package.json').name")@$(node -p "require('./package.json').version")"
          if npm view "${package}" version > /dev/null 2>&1; then
            echo "${package} is already published."
          else
            npm publish --access public --provenance
          fi
